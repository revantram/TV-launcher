name: Release Glass Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify APK Asset
        run: |
          ls -lh dist/GlassLauncher-FireTV.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "Glass Launcher v1.0.1 (Fire TV Stick)"
          body: |
            ## 📺 Glass Launcher v1.0.1 for Amazon Fire TV Stick & Android TV
            
            ### 📥 Download & Install on Fire TV:
            Click on **`GlassLauncher-FireTV.apk`** in the **Assets** section below to download directly to your TV or phone!
            
            ### 🚀 Highlights:
            - **100% Remote D-Pad Navigation**: 120ms focus animation, scale 1.06x, white glow border.
            - **Alphabet Quick-Jump (A-Z Bar)**: Jump directly to apps by letter with 1 click on remote.
            - **Fire OS Home Button Intercept**: Accessibility hook returns to Glass Launcher when Home is pressed.
            - **On-Screen Remote Key Legend**: Visual hints for `[OK] Open`, `[MENU] Options`, `[REW] Top`, `[FF] Filter`, `[BACK] Home`.
            - **1-Click RAM Booster**: Clears icon cache with real-time freed memory pill.
            - **OLED Screen Burn-In Protection**: 15-minute inactivity deep-black ambient clock saver.
            - **Universal App Scanner**: Amazon Appstore, Leanback TV, and Sideloaded APKs.
          files: dist/GlassLauncher-FireTV.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
