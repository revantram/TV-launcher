name: Release Glass Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify APK Asset
        run: |
          if [ -f "dist/GlassLauncher-FireTV.apk" ]; then
            echo "Pre-built APK is ready: $(ls -lh dist/GlassLauncher-FireTV.apk)"
          else
            echo "Copying built APK..."
            mkdir -p dist
            cp app/build/outputs/apk/debug/app-debug.apk dist/GlassLauncher-FireTV.apk || true
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Glass Launcher v1.0.0 (Fire TV Stick)"
          body: |
            ## 📺 Glass Launcher v1.0.0 for Amazon Fire TV Stick & Android TV
            
            ### 🚀 Features:
            - **100% Remote D-Pad Navigation**: 120ms focus animation, glowing white liquid glass border, D-Pad Menu button context menu.
            - **Alphabet Quick-Jump (A-Z Bar)**: Jump directly to apps by first letter with 1 click on Fire TV remote.
            - **Fire OS Home Button Intercept**: Accessibility Service hook returns to Glass Launcher when Amazon Home button is pressed.
            - **On-Screen Remote Key Legend**: Visual hints for `[OK] Open`, `[MENU] Options`, `[REW] Top`, `[FF] Filter`, `[BACK] Home`.
            - **1-Click RAM Booster**: Clears non-essential caches with real-time freed memory pill.
            - **OLED Screen Burn-In Protection**: 15-minute inactivity deep-black ambient clock saver.
            - **Universal App Scanner**: Discovers Amazon Appstore apps, Android TV Leanback apps, and Sideloaded APKs.
            
            ### 📥 Download & Install on Fire TV:
            1. Download the **`GlassLauncher-FireTV.apk`** file from the Assets section below.
            2. Send it to your Fire TV Stick using **Send Files to TV** or **Downloader App**.
            3. Open and install!
          files: dist/GlassLauncher-FireTV.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
