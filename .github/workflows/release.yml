name: Build and Release Glass Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk GlassLauncher-FireTV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-FireTV
          path: GlassLauncher-FireTV.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Glass Launcher v1.0.0 (Fire TV Stick)"
          body: |
            ## 📺 Glass Launcher v1.0.0 for Amazon Fire TV Stick & Android TV
            
            ### 🚀 Highlights:
            - **60 FPS Liquid Glass UI**: Lightweight iOS-inspired glassmorphism, 100% lag-free on 1GB RAM Fire TV Sticks.
            - **Home Button Intercept**: Accessibility Service hook catches Fire TV Home button and returns immediately to Glass Launcher.
            - **Remote D-Pad Optimization**: 120ms focus animation, scale 1.06x, white glow border, Menu button context menu.
            - **Universal App Scanner**: Discovers Amazon Appstore apps, Android TV Leanback apps, and Sideloaded APKs.
            - **1-Click RAM Booster**: Clears icon cache and triggers GC with real-time freed memory pill.
            - **OLED Screen Burn-In Protection**: 15-minute inactivity deep-black ambient clock mode.
            
            ### 📥 Download & Install:
            1. Download the **`GlassLauncher-FireTV.apk`** asset below.
            2. Send it to your Fire TV Stick using **Send Files to TV** or **Downloader**.
            3. Open and install!
          files: GlassLauncher-FireTV.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
