name: Release Glass Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Pre-Built APK
        run: |
          if [ -f "dist/apk_base64.txt" ]; then
            echo "Extracting APK from dist/apk_base64.txt..."
            base64 -d dist/apk_base64.txt > GlassLauncher-FireTV.apk
          elif [ -f "dist/GlassLauncher-FireTV.apk" ]; then
            cp dist/GlassLauncher-FireTV.apk GlassLauncher-FireTV.apk
          else
            echo "Fallback building APK..."
            chmod +x gradlew || true
            ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache || true
            cp app/build/outputs/apk/debug/app-debug.apk GlassLauncher-FireTV.apk || true
          fi
          ls -lh GlassLauncher-FireTV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-FireTV
          path: GlassLauncher-FireTV.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "Glass Launcher v1.0.5 (Fire TV Stick)"
          body: |
            ## 📺 Glass Launcher v1.0.5 for Amazon Fire TV Stick & Android TV
            
            ### 📥 Download & Install on Fire TV:
            Click on **`GlassLauncher-FireTV.apk`** below in the **Assets** section to download directly to your TV or phone!
            
            ### 🚀 Features:
            - **100% Remote D-Pad Navigation**: 120ms focus animation, scale 1.06x, white glow border.
            - **Alphabet Quick-Jump (A-Z Bar)**: Jump directly to apps by first letter with 1 click on Fire TV remote.
            - **Fire OS Home Button Intercept**: Accessibility hook returns to Glass Launcher when Home is pressed.
            - **On-Screen Remote Key Legend**: Visual hints for `[OK] Open`, `[MENU] Options`, `[REW] Top`, `[FF] Filter`, `[BACK] Home`.
            - **1-Click RAM Booster**: Clears icon cache with real-time freed memory pill.
            - **OLED Screen Burn-In Protection**: 15-minute inactivity deep-black ambient clock saver.
            - **Universal App Scanner**: Amazon Appstore, Leanback TV, and Sideloaded APKs.
          files: GlassLauncher-FireTV.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
